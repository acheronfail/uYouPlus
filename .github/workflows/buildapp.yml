# Original idea by @ISnackable. Thanks to him for handling the hardest parts!
# https://github.com/ISnackable/CercubePlus/blob/main/.github/workflows/Build.yml

name: Build and Release uYouPlus

on:
  workflow_dispatch:
    inputs:
      uyou_version:
        description: "The version of uYou"
        default: "3.0.4"
        required: true
        type: string
      uyou_url:
        description: "The URL for download uYou"
        default: "https://something.url/uyou.deb"
        required: false
        type: string
      decrypted_youtube_url:
        description: "Public Google Drive share link or direct HTTPS URL for a decrypted YouTube IPA."
        default: "https://drive.google.com/file/d/1e9FXrX73j0ddNqijOihGqzHf4Cu4QtNS/view?usp=drive_link"
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID. Not recommended"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the name of the app on the Home Screen. Not recommended"
        default: "YouTube"
        required: true
        type: string
      create_release:
        description: "Create a draft release containing the IPA"
        default: false
        required: false
        type: boolean
      upload_artifact:
        description: "Upload the IPA as a workflow artifact"
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build uYouPlus
    runs-on: macos-15-intel
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4.2.1
        with:
          path: main
          submodules: recursive

      - name: Caching brew dependencies
        id: brew_cache
        uses: tecolicom/actions-use-homebrew-tools@v1.2
        with:
          tools: ldid dpkg make
          cache: yes

      - name: Install Dependencies
        if: steps.brew_cache.outputs.cache-hit != 'true'
        run: brew install ldid dpkg make

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v4.2.1
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Caching SDK
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iOS-16.5-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}

      - name: Download iOS 16.5 SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git && cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Theos Jailed
        uses: actions/checkout@v4.2.1
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed
          submodules: recursive

      - name: Install Theos Jailed
        run: |
          ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Prepare YouTube iPA
        id: prepare_youtube
        run: |
          if [[ "$YOUTUBE_URL" == https://drive.google.com/* ]]; then
            python3 -m venv "$RUNNER_TEMP/gdown-venv"
            "$RUNNER_TEMP/gdown-venv/bin/python" -m pip install --disable-pip-version-check gdown
            "$RUNNER_TEMP/gdown-venv/bin/gdown" "$YOUTUBE_URL" -O main/YouTube.ipa
          else
            curl --fail --location --silent --show-error "$YOUTUBE_URL" --output main/YouTube.ipa
          fi
          cd main
          unzip -tq YouTube.ipa
          unzip -q YouTube.ipa
          test -f Payload/YouTube.app/Info.plist
          youtube_version=$(plutil -extract CFBundleVersion raw -o - Payload/YouTube.app/Info.plist)
          test -n "$youtube_version"
          echo "YouTube version: $youtube_version"
          echo "youtube_version=$youtube_version" >> "$GITHUB_OUTPUT"

        env:
          THEOS: ${{ github.workspace }}/theos
          YOUTUBE_URL: ${{ inputs.decrypted_youtube_url }}

      - name: Fix compiling & Build Package
        id: build_package
        run: |
          mkdir -p theos/lib/iphone/rootless
          cd main
          make package THEOS_PACKAGE_SCHEME=rootless IPA=Payload/YouTube.app FINALPACKAGE=1 \
            "YOUTUBE_VERSION=$YOUTUBE_VERSION" "UYOU_VERSION=$UYOU_VERSION" \
            "BUNDLE_ID=$BUNDLE_ID" "DISPLAY_NAME=$APP_NAME"
          package=$(find packages -maxdepth 1 -name '*.ipa' -type f -print -quit)
          test -n "$package"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$package"
          echo "Bundle ID: $BUNDLE_ID"

        env:
          THEOS: ${{ github.workspace }}/theos
          UYOU_VERSION: ${{ inputs.uyou_version }}
          UYOU_URL: ${{ inputs.uyou_url }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}

      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4.4.3
        env:
          UYOU_VERSION: ${{ inputs.uyou_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        with:
          name: uYouPlus_${{ env.YOUTUBE_VERSION }}_${{ env.UYOU_VERSION }}
          path: ${{ github.workspace }}/main/${{ steps.build_package.outputs.package }}
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.create_release }}
        id: create_release
        uses: qnblackcat/action-gh-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UYOU_VERSION: ${{ inputs.uyou_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
          DRAFT: ${{ inputs.create_release }}
        with:
          tag_name: v${{ env.YOUTUBE_VERSION }}-${{ env.UYOU_VERSION }}-(${{ github.run_number }})
          name: v${{ env.YOUTUBE_VERSION }}-${{ env.UYOU_VERSION }}-(${{ github.run_number }})
          files: main/packages/*.ipa
          draft: ${{ env.DRAFT }}
